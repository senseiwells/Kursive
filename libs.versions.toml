[versions]
minecraft     = "26.1"
fabric-loader = "0.18.4"
fabric-api    = "0.144.0+26.1"
fabric-kotlin = "1.13.9+kotlin.2.3.10"
mod-menu      = "18.0.0-alpha.6"
keybinds      = "0.3.0+26.1"
yacl          = "3.9.0+26.1-fabric"

# Scripting
arcade        = "0.9.0-beta.14+26.1"

# Plugins
fabric-loom   = "1.15-SNAPSHOT"
mod-publish   = "0.8.1"
shadow        = "8.3.5"

[libraries]
minecraft     = { module = "com.mojang:minecraft"                    , version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader"              , version.ref = "fabric-loader" }
fabric-api    = { module = "net.fabricmc.fabric-api:fabric-api"      , version.ref = "fabric-api" }
fabric-kotlin = { module = "net.fabricmc:fabric-language-kotlin"     , version.ref = "fabric-kotlin" }
mod-menu      = { module = "com.terraformersmc:modmenu"              , version.ref = "mod-menu" }
keybinds      = { module = "me.senseiwells:simple-keybinding-library", version.ref = "keybinds" }
yacl          = { module = "dev.isxander:yet-another-config-lib"     , version.ref = "yacl" }

# Scripting
kotlin-metadata      = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm" }

arcade-commands       = { module = "net.casualchampionships:arcade-commands"      , version.ref = "arcade" }
arcade-event-registry = { module = "net.casualchampionships:arcade-event-registry", version.ref = "arcade" }
arcade-events-client  = { module = "net.casualchampionships:arcade-events-client" , version.ref = "arcade" }
arcade-events-server  = { module = "net.casualchampionships:arcade-events-server" , version.ref = "arcade" }
arcade-utils          = { module = "net.casualchampionships:arcade-utils"         , version.ref = "arcade" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom"       , version.ref = "fabric-loom" }
mod-publish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod-publish" }
shadow      = { id = "com.gradleup.shadow"            , version.ref = "shadow" }
